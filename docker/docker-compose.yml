# S2M2 Stereo Vision Pipeline — Docker Compose
#
# Build:
#   docker compose -f docker/docker-compose.yml build
#
# Start inference pipeline:
#   docker compose -f docker/docker-compose.yml up inference
#
# Export an engine:
#   docker compose -f docker/docker-compose.yml run export \
#     --model_type S --img_width 2464 --img_height 2048 --precision fp16
#
# Interactive export shell:
#   docker compose -f docker/docker-compose.yml run export bash

volumes:
  s2m2_models:
    name: s2m2_models
  s2m2_data:
    name: s2m2_data

services:
  # ── Export container ──────────────────────────────────────────────────
  export:
    build:
      context: ..
      dockerfile: docker/export/Dockerfile
    image: s2m2-export:latest
    container_name: s2m2-export
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - s2m2_models:/workspace/alg-S2M2/weights/trt_save

  # ── Inference container ──────────────────────────────────────────────
  inference:
    build:
      context: ..
      dockerfile: docker/inference/Dockerfile
    image: s2m2-inference:latest
    container_name: s2m2-inference
    runtime: nvidia
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - s2m2_models:/models:ro
      - s2m2_data:/data
    stdin_open: true
    tty: true
